[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admiser"
# 单一版本号来源：src/admiser/_version.py（避免与 __version__ 漂移）
dynamic = ["version"]
description = "A unified optimal control problem solver inspired by Teo's control parametrization approaches enhanced by automatic differentiation"
readme = "README.md"
license = "MIT"
authors = [{name = "Bowen Zhao"}]
# 3.10 起才支持 `X | None` 形式的运行时注解（ocp_problem_builders.py 用到）
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib"
]
[project.scripts]
admiser-install-cppad = "admiser_cppad_installer.install_cppad_cli:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "admiser._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# include examples result
[tool.setuptools.package-data]
"admiser.examples" = ["notebooks/*.ipynb"]
"admiser_cppad_installer" = ["build_cppad.sh"]