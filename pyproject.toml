[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admiser"
# Single source of truth for the version: src/admiser/_version.py
dynamic = ["version"]
description = "A unified optimal control problem solver inspired by Teo's control parametrization approaches enhanced by automatic differentiation"
readme = "README.md"
license = "MIT"
authors = [{name = "Bowen Zhao"}]
# `X | None` runtime annotations (used in ocp_problem_builders.py) need 3.10
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib"
]

[project.optional-dependencies]
# Everything needed to run the test suite. Install with:  pip install -e ".[dev]"
dev = ["pytest>=7"]

[project.scripts]
admiser-install-cppad = "admiser_cppad_installer.install_cppad_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "admiser._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# include examples result
[tool.setuptools.package-data]
"admiser.examples" = ["notebooks/*.ipynb"]
"admiser_cppad_installer" = ["build_cppad.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the tests directory on sys.path so test files can import the conftest
# helpers directly; this is the recommended layout for a src/ project.
pythonpath = ["tests"]
