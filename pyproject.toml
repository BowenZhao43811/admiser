[build-system]
# license-files (PEP 639) needs setuptools >= 77
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "admiser"
# Single source of truth for the version: src/admiser/_version.py
dynamic = ["version"]
description = "A unified optimal control problem solver inspired by Teo's control parametrization approaches enhanced by automatic differentiation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Bowen Zhao"}]
# `X | None` runtime annotations (used in problem_definition.py) need 3.10
requires-python = ">=3.10"
keywords = [
  "optimal control",
  "control parametrization",
  "automatic differentiation",
  "trajectory optimization",
  "nonlinear programming",
  "CppAD",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib"
]

[project.urls]
Homepage = "https://github.com/BowenZhao43811/admiser"
Repository = "https://github.com/BowenZhao43811/admiser"
Issues = "https://github.com/BowenZhao43811/admiser/issues"

[project.optional-dependencies]
# Everything needed to run the test suite. Install with:  pip install -e ".[dev]"
dev = ["pytest>=7"]

[project.scripts]
admiser-install-cppad = "admiser_cppad_installer.install_cppad_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "admiser._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# include examples result
[tool.setuptools.package-data]
"admiser.examples" = ["notebooks/*.ipynb"]
"admiser_cppad_installer" = ["build_cppad.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the tests directory on sys.path so test files can import the conftest
# helpers directly; this is the recommended layout for a src/ project.
pythonpath = ["tests"]
