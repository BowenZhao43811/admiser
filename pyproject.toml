[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admiser"
version = "0.1.1"
description = "A unified optimal control problem solver inspired by Teo's control parametrization approaches enhanced by automatic differentiation"
readme = "README.md"
license = "MIT"
authors = [{name = "Bowen Zhao"}]
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib"
]
[project.scripts]
admiser-install-cppad = "admiser.tools.install_cppad_py_cli:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# include examples result
[tool.setuptools.package-data]
"admiser.examples" = ["notebooks/*.ipynb"]
"admiser.tools" = ["build_cppad_py.sh"]